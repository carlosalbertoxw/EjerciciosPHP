name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, mbstring, pdo_sqlite
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
